<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b62ff" />
    <title>EmbedKit</title>
    <link rel="icon" href="/embedkit/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --fg: #16181d; --muted: #5b6472; --bg: #ffffff; --accent: #0b62ff; --border: #e3e7ee; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e8eaf0; --muted: #98a2b3; --bg: #0e1014; --accent: #6ea0ff; --border: #23262e; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.55 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
      .box { max-width: 480px; text-align: center; }
      h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      nav { display: flex; gap: 12px; justify-content: center; }
      a { display: inline-block; padding: 10px 18px; border: 1px solid var(--border); border-radius: 8px; color: var(--accent); text-decoration: none; font-size: 15px; }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Page not available offline</h1>
      <p>This page isn't cached on this device yet. Open it once while online and it will work offline next time.</p>
      <nav>
        <a href="/embedkit/en/">English</a>
        <a href="/embedkit/ru/">Русский</a>
      </nav>
    </div>
  </body>
</html>
